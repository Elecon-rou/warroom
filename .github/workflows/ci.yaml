name: CI
on:
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm run format:check --prefix web
      - run: npm test --prefix web
      - run: npm run build --prefix web
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -trimpath -o /tmp/warroom .
      - uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4
        with:
          version: v3.17.2
      - run: python3 -m pip install PyYAML==6.0.3
      - run: python3 .github/scripts/test-chart.py
      - name: Validate Kubernetes schemas
        run: |
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.6.7
          helm template test charts/warroom --set image.repository=ghcr.io/example/warroom --set ingress.enabled=true \
            | "$(go env GOPATH)/bin/kubeconform" -strict -summary -kubernetes-version 1.25.0
      - name: Validate workflow syntax
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint"
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build both target architectures (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Load native image for smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: warroom:ci
          cache-from: type=gha
      - name: Check static UI and Go health endpoint
        run: |
          docker run -d --name warroom --read-only --cap-drop ALL \
            --security-opt no-new-privileges -p 127.0.0.1:8080:8080 warroom:ci
          trap 'docker logs warroom; docker rm -f warroom' EXIT
          curl --fail --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:8080/api/health
          curl --fail http://127.0.0.1:8080/ | grep -q '<!doctype html>'
