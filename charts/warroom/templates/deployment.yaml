{{- if and .Values.dashboards.existingConfigMap .Values.dashboards.existingClaim }}
{{- fail "choose dashboards.existingConfigMap or dashboards.existingClaim, not both" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "warroom.fullname" . }}
  labels:
    {{- include "warroom.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "warroom.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/sources: {{ include (print $.Template.BasePath "/sources.yaml") . | sha256sum }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- mergeOverwrite (deepCopy .Values.podLabels) (include "warroom.selectorLabels" . | fromYaml) | toYaml | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      serviceAccountName: {{ include "warroom.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.extraInitContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: warroom
          image: {{ include "warroom.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "warroom.fullname" . }}
            {{- with .Values.existingSecret }}
            - secretRef:
                name: {{ . | quote }}
            {{- end }}
            {{- with .Values.envFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            {{- if or .Values.dataSources .Values.dataSourcesConfigMap }}
            - name: DATA_SOURCES_FILE
              value: /etc/warroom/sources/sources.json
            {{- end }}
            {{- if or .Values.dashboards.existingConfigMap .Values.dashboards.existingClaim }}
            - name: DASHBOARDS_DIR
              value: {{ .Values.dashboards.mountPath | quote }}
            {{- end }}
            - name: LISTEN_ADDR
              value: {{ printf "0.0.0.0:%v" .Values.containerPort | quote }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or .Values.dataSources .Values.dataSourcesConfigMap .Values.dashboards.existingConfigMap .Values.dashboards.existingClaim .Values.extraVolumeMounts }}
          volumeMounts:
            {{- if or .Values.dataSources .Values.dataSourcesConfigMap }}
            - name: data-sources
              mountPath: /etc/warroom/sources
              readOnly: true
            {{- end }}
            {{- if or .Values.dashboards.existingConfigMap .Values.dashboards.existingClaim }}
            - name: dashboards
              mountPath: {{ .Values.dashboards.mountPath | quote }}
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
        {{- with .Values.extraContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if or .Values.dataSources .Values.dataSourcesConfigMap .Values.dashboards.existingConfigMap .Values.dashboards.existingClaim .Values.extraVolumes }}
      volumes:
        {{- if or .Values.dataSources .Values.dataSourcesConfigMap }}
        - name: data-sources
          configMap:
            name: {{ default (printf "%s-sources" (include "warroom.fullname" .)) .Values.dataSourcesConfigMap }}
        {{- end }}
        {{- if .Values.dashboards.existingConfigMap }}
        - name: dashboards
          configMap:
            name: {{ .Values.dashboards.existingConfigMap | quote }}
        {{- else if .Values.dashboards.existingClaim }}
        - name: dashboards
          persistentVolumeClaim:
            claimName: {{ .Values.dashboards.existingClaim | quote }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
